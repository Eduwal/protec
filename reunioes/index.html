<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Reuniões | Projeta</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#172b4d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:25px}header{background:#173b69;color:white;padding:22px 0}h1{font-size:25px;margin:0}header p{margin:5px 0 0;color:#dbe8f7}.panel{background:white;border:1px solid #dfe6ef;border-radius:12px;padding:20px;margin:18px 0;box-shadow:0 3px 12px #173b6909}h2{font-size:19px;margin:0 0 16px}.filters,.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #c9d4e2;border-radius:7px;background:white;color:#172b4d;font:inherit}textarea{min-height:72px}.wide{grid-column:span 2}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}button,.filelabel{border:0;border-radius:7px;background:#1c5fa9;color:white;padding:10px 14px;font:600 14px system-ui;cursor:pointer}.secondary{background:#e8eef6;color:#24415f}.danger{background:#b33a3a}.tablebox{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:950px}th,td{padding:11px 9px;text-align:left;border-bottom:1px solid #e7edf4;font-size:13px}th{background:#f0f5fb}tr:hover td{background:#f8fbff}.pill{padding:5px 9px;border-radius:15px;font-weight:650;font-size:12px;white-space:nowrap}.done{background:#e2f3e8;color:#20613b}.new{background:#fff0d9;color:#9a4c0a}.tiny{padding:6px 9px;font-size:12px}.muted{color:#61738a;font-size:13px}.summary{display:flex;gap:20px;flex-wrap:wrap}.summary strong{font-size:20px}.summary span{font-size:13px;color:#62748a}#notice{min-height:22px;margin-top:10px;font-size:13px}.filelabel input{display:none}@media(max-width:800px){.filters,.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:span 2}}@media(max-width:480px){.filters,.fields{grid-template-columns:1fr}.wide{grid-column:span 1}.wrap{padding:14px}}</style></head><body><header><div class="wrap"><h1>Controle de Reuniões</h1><p>Projeta Tecnologia da Informação</p></div></header><main class="wrap"><section class="panel"><div class="summary"><div><strong id="total">0</strong><br><span>Reuniões exibidas</span></div><div><strong id="novos">0</strong><br><span>Novas</span></div><div><strong id="finalizados">0</strong><br><span>Finalizadas</span></div></div></section><section class="panel"><h2>Consultar reuniões</h2><div class="filters"><div><label for="busca">Buscar ticket ou cliente</label><input id="busca" placeholder="Digite para pesquisar"></div><div><label for="fmunicipio">Município</label><select id="fmunicipio"><option value="">Todos</option></select></div><div><label for="fvertical">Vertical</label><select id="fvertical"><option value="">Todas</option></select></div><div><label for="fstatus">Status</label><select id="fstatus"><option value="">Todos</option><option>Novo</option><option>Finalizado</option></select></div></div><div class="actions"><button id="limparFiltros" class="secondary">Limpar filtros</button><button id="exportar">Exportar JSON</button><label class="filelabel">Importar JSON<input id="importar" type="file" accept="application/json,.json"></label></div><p class="muted">Os dados são salvos apenas neste navegador. Exporte o JSON regularmente para fazer backup.</p><div class="tablebox"><table><thead><tr><th>Ticket</th><th>Data</th><th>Horário</th><th>Cliente</th><th>Município</th><th>Vertical</th><th>Assunto</th><th>Status</th><th>Ações</th></tr></thead><tbody id="linhas"></tbody></table></div></section><section class="panel" id="formulario"><h2 id="tituloForm">Nova reunião</h2><form id="form"><div class="fields"><div><label for="ticket">Ticket *</label><input id="ticket" required inputmode="numeric" maxlength="30"></div><div><label for="data">Data da reunião *</label><input id="data" type="date" required></div><div><label for="horario">Horário</label><input id="horario" type="time"></div><div><label for="cliente">Cliente *</label><input id="cliente" required maxlength="120"></div><div><label for="municipio">Município *</label><input id="municipio" required maxlength="120" list="municipios"></div><div><label for="vertical">Vertical *</label><input id="vertical" required maxlength="120" list="verticais"></div><div><label for="status">Status</label><select id="status"><option>Novo</option><option>Finalizado</option></select></div><div class="wide"><label for="assunto">Assunto</label><textarea id="assunto" maxlength="1000"></textarea></div></div><datalist id="municipios"></datalist><datalist id="verticais"></datalist><div class="actions"><button type="submit" id="salvar">Salvar reunião</button><button type="button" id="cancelar" class="secondary">Limpar formulário</button></div><div id="notice" role="status"></div></form></section></main><script>
'use strict';
const KEY='projeta_reunioes_v1';
const iniciais=[
['21833','2026-09-28','realizado','Marines','Brejetuba','Arrecadação','não tem tratativas','Finalizado'],
['21837','2026-09-29','realizado','Vinicios','Cambuci','Arrecadação','tem tratativas','Finalizado'],
['22087','2026-10-15','14:00','Caio','Macacu','Contratação','não tem tratativas','Finalizado'],
['22093','2026-10-20','14:00','Valmenia','Cimpolosul','Contratação','tem tratativas','Finalizado'],
['22152','2026-10-22','14:30','Alex','Cambuci','RH','tem tratativas','Finalizado'],
['22223','2026-10-29','14:00','Aline','Cambuci','Contábil','','Novo'],
['22253','2026-10-03','10:00','Jose Ricardo','Macacu','Contábil','','Novo'],
['22255','2026-11-03','14:00','Renata','Macacu','RH','','Novo'],
['22256','2026-11-11','10:00','Angelo','Macacu','Contratação','','Novo'],
['22257','2026-11-11','11:00','Helen','Macacu','Almoxarifado','','Novo']
].map(([ticket,data,horario,cliente,municipio,vertical,assunto,status])=>({ticket,data,horario,cliente,municipio,vertical,assunto,status}));
// O ticket 22253 foi transcrito conforme a imagem: 03/11/2026, corrigido abaixo.
iniciais.find(x=>x.ticket==='22253').data='2026-11-03';
let dados;try{const s=localStorage.getItem(KEY);dados=s?JSON.parse(s):iniciais;if(!Array.isArray(dados))throw Error('Formato inválido')}catch{dados=iniciais}
let editando=null;const $=id=>document.getElementById(id);const campos=['ticket','data','horario','cliente','municipio','vertical','assunto','status'];const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const formatar=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):s;
function persistir(){localStorage.setItem(KEY,JSON.stringify(dados))}function opções(id,values){const select=$(id),v=select.value;select.innerHTML='<option value="">'+(id==='fmunicipio'?'Todos':'Todas')+'</option>'+[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR')).map(x=>'<option value="'+escapeHtml(x)+'">'+escapeHtml(x)+'</option>').join('');select.value=v}function atualizarListas(){opções('fmunicipio',dados.map(x=>x.municipio));opções('fvertical',dados.map(x=>x.vertical));for(const [id,k] of [['municipios','municipio'],['verticais','vertical']])$(id).innerHTML=[...new Set(dados.map(x=>x[k]))].map(x=>'<option value="'+escapeHtml(x)+'"></option>').join('')}
function render(){atualizarListas();const q=$('busca').value.trim().toLocaleLowerCase('pt-BR'),m=$('fmunicipio').value,v=$('fvertical').value,s=$('fstatus').value;const lista=dados.filter(x=>(!q||(x.ticket+' '+x.cliente).toLocaleLowerCase('pt-BR').includes(q))&&(!m||x.municipio===m)&&(!v||x.vertical===v)&&(!s||x.status===s)).sort((a,b)=>a.data.localeCompare(b.data)||a.horario.localeCompare(b.horario));$('total').textContent=lista.length;$('novos').textContent=lista.filter(x=>x.status==='Novo').length;$('finalizados').textContent=lista.filter(x=>x.status==='Finalizado').length;$('linhas').innerHTML=lista.length?lista.map(x=>'<tr>'+['ticket','data','horario','cliente','municipio','vertical','assunto'].map(k=>'<td>'+escapeHtml(k==='data'?formatar(x[k]):x[k])+'</td>').join('')+'<td><span class="pill '+(x.status==='Novo'?'new':'done')+'">'+escapeHtml(x.status)+'</span></td><td><button class="tiny secondary" data-edit="'+escapeHtml(x.ticket)+'">Editar</button> <button class="tiny danger" data-delete="'+escapeHtml(x.ticket)+'">Excluir</button></td></tr>').join(''):'<tr><td colspan="9">Nenhuma reunião encontrada.</td></tr>'}
function limpar(){editando=null;$('form').reset();$('tituloForm').textContent='Nova reunião';$('salvar').textContent='Salvar reunião';$('ticket').readOnly=false;$('notice').textContent=''}
$('form').addEventListener('submit',e=>{e.preventDefault();const x=Object.fromEntries(campos.map(k=>[k,$(k).value.trim()]));if(!x.ticket||!x.data||!x.cliente||!x.municipio||!x.vertical)return;if(dados.some(r=>r.ticket===x.ticket&&r.ticket!==editando)){alert('Este ticket já está cadastrado.');return}if(editando){dados[dados.findIndex(r=>r.ticket===editando)]=x}else dados.push(x);persistir();limpar();render();$('notice').textContent='Reunião salva com sucesso neste navegador.'});$('cancelar').onclick=limpar;
$('linhas').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const x=dados.find(r=>r.ticket===edit.dataset.edit);if(!x)return;editando=x.ticket;campos.forEach(k=>$(k).value=x[k]||'');$('ticket').readOnly=true;$('tituloForm').textContent='Editar reunião';$('salvar').textContent='Salvar alterações';$('formulario').scrollIntoView({behavior:'smooth'})}if(del){const ticket=del.dataset.delete;if(confirm('Excluir a reunião do ticket '+ticket+'?')){dados=dados.filter(x=>x.ticket!==ticket);persistir();if(editando===ticket)limpar();render()}}});['busca','fmunicipio','fvertical','fstatus'].forEach(id=>$(id).addEventListener(id==='busca'?'input':'change',render));$('limparFiltros').onclick=()=>{['busca','fmunicipio','fvertical','fstatus'].forEach(id=>$(id).value='');render()};$('exportar').onclick=()=>{const blob=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='reunioes-projeta-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importar').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!Array.isArray(v)||v.some(x=>!x||typeof x!=='object'||campos.some(k=>typeof x[k]!=='string')||!x.ticket||!x.data||!x.cliente||!x.municipio||!x.vertical||!['Novo','Finalizado'].includes(x.status))||new Set(v.map(x=>x.ticket)).size!==v.length)throw Error('Arquivo inválido');if(confirm('Substituir todas as reuniões atuais pelos '+v.length+' registros do arquivo?')){dados=v;persistir();limpar();render();alert('Importação concluída.')}}catch(err){alert('Não foi possível importar: '+err.message)}finally{e.target.value=''}};render();
</script></body></html>
